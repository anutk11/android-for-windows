name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build a real Android library with Google's Android NDK
  android-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libhello.so (Android x86_64, API 24)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p out
          "$TC/clang" --target=x86_64-linux-android24 -shared -fPIC -O2 \
            -fstack-protector-strong -U_FORTIFY_SOURCE \
            -Wl,--pack-dyn-relocs=none -Wl,-soname,libhello.so \
            -o out/libhello.so test/hello.c -llog
          "$TC/clang" --target=x86_64-linux-android24 -shared -fPIC -O2 \
            -Wl,--pack-dyn-relocs=none -o out/libsyscall_test.so test/syscall_test.c
          "$TC/clang" --target=x86_64-linux-android24 -shared -fPIC -O2 \
            -Wl,--pack-dyn-relocs=none -o out/libredzone_test.so test/redzone_test.c
          "$TC/clang++" --target=x86_64-linux-android24 -shared -fPIC -O2 -fstack-protector-strong \
            -Wl,--pack-dyn-relocs=none -o out/libcxx_exception_test.so test/cxx_exception_test.cpp
          echo "--- landing pads in libcxx_exception_test.so (from .gcc_except_table)"
          "$TC/llvm-readelf" -SW out/libcxx_exception_test.so | grep -E "gcc_except|eh_frame"
          "$TC/llvm-readelf" -h -d out/libhello.so
          echo "--- TLS relocations (GOTTPOFF/TPOFF would mean real initial-exec ELF TLS) ---"
          for f in out/libhello.so out/libsyscall_test.so; do echo "$f:"; "$TC/llvm-readelf" -rW "$f" | grep -E "TPOFF|TLS|DTPMOD" || echo "  none"; done
          echo "--- section containing offset 0x4f5 in libhello.so ---"
          "$TC/llvm-readelf" -SW out/libhello.so | grep -E "^\s+\[" | head -30
          echo "--- afw_stack_test machine code ---"
          "$TC/llvm-objdump" -d --disassemble-symbols=afw_stack_test out/libhello.so
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" out/
      - uses: actions/upload-artifact@v4
        with:
          name: libhello
          path: out/*.so

  # Gate G1 experiment: static scan of the real bionic libc.so.
  # The extracted Android files are NOT uploaded (licensing): only the report.
  bionic-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Extract real bionic libc.so from an Android 14 x86_64 image
        run: bash tools/fetch_bionic.sh
      - name: Build the scanner (Zydis)
        run: bash tools/build_scan.sh
      - name: Scan libc.so
        run: |
          DBG=""; [ -f out/bionic/libc.debug ] && DBG=out/bionic/libc.debug
          out/scan/syscall_scan out/bionic/libc.so $DBG | tee out/libc-scan.txt
          if [ -f out/bionic/linker64 ]; then
            out/scan/syscall_scan out/bionic/linker64 | tee out/linker64-scan.txt
          fi
      - name: "Analyse: ELF TLS in the real libc.so"
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"; TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "--- PT_TLS"; "$TC/llvm-readelf" -lW out/bionic/libc.so | grep -E "TLS|Type"
          echo "--- TLS relocations by type"; "$TC/llvm-readelf" -rW out/bionic/libc.so | grep -oE "R_X86_64_(TPOFF64|TPOFF32|DTPMOD64|DTPOFF64|GOTTPOFF|TLSGD|TLSLD|TLSDESC)" | sort | uniq -c
          echo "--- TPOFF64 relocations (offset, symbol)"; "$TC/llvm-readelf" -rW out/bionic/libc.so | grep TPOFF | head -20
          echo "--- TLS symbols"; "$TC/llvm-readelf" -sW out/bionic/libc.so | grep " TLS " | head -20
          echo "--- one fs:[reg] site (gwp_asan initPRNG)"
          "$TC/llvm-objdump" -d --no-show-raw-insn --disassemble-symbols=_ZN8gwp_asan20GuardedPoolAllocator8initPRNGEv out/bionic/libc.so | head -25
      - name: "Measure: patch the real libraries (never run them)"
        run: |
          bash tools/build_linux.sh
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" out/
          for f in out/bionic/libc.so out/bionic/linker64 out/libc++_shared.so; do
            echo "================ $f"
            out/afw-loader "$f" --patch-report 2>&1 | grep -vE "^  MISSING" | tee -a out/patch-scan.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bionic-scan-report
          path: out/*-scan.txt

  # 2. Build the loader on Windows and run the Android library with it
  windows:
    needs: android-lib
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: libhello
          path: out
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build afw-loader.exe
        shell: cmd
        run: build.bat
      - name: Run M0 tests on Windows
        shell: cmd
        run: out\afw-loader.exe out\libhello.so
      - name: Run G1 syscall-patching tests on Windows
        shell: cmd
        run: out\afw-loader.exe out\libsyscall_test.so
      - name: "VMA layer: mmap / munmap / mprotect / madvise on Windows"
        shell: cmd
        run: |
          clang-cl /nologo /O2 /W3 /D_CRT_SECURE_NO_WARNINGS /Fe:out\vma_test.exe /Foout\ tools\vma_test.c src\vma.c src\syscall.c src\platform.c
          out\vma_test.exe
      - name: "C++ exceptions: every landing pad found, nothing unproven (static)"
        shell: cmd
        run: out\afw-loader.exe out\libcxx_exception_test.so --patch-report --strict --min-landing-pads=1
      - name: "Negative test: red zone sites must be refused"
        shell: cmd
        run: out\afw-loader.exe out\libredzone_test.so
      - name: "Explore: load the NDK's real libc++_shared.so"
        continue-on-error: true
        shell: cmd
        run: out\afw-loader.exe out\libc++_shared.so --patch-report
      - name: "Experiment: fs: TLS on Windows"
        shell: cmd
        run: |
          clang-cl /nologo /O2 /Fe:out\fs_probe.exe /Foout\ tools\fs_probe.c
          out\fs_probe.exe
      - name: "Experiment: WRFSBASE on Windows"
        shell: cmd
        run: |
          clang-cl /nologo /O2 /Fe:out\fsbase_probe.exe /Foout\ tools\fsbase_probe.c
          out\fsbase_probe.exe
      - name: Package
        shell: cmd
        run: |
          mkdir pkg
          copy out\afw-loader.exe pkg\
          copy out\libhello.so pkg\
          copy tools\run-test.bat pkg\
          copy out\fsbase_probe.exe pkg\
          copy tools\run-fsbase-probe.bat pkg\
      - uses: actions/upload-artifact@v4
        with:
          name: afw-windows
          path: pkg/*

  # 3. Publish a download link: Releases -> nightly
  release:
    needs: windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afw-windows
          path: pkg
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pkg && zip -r ../android-for-windows-nightly.zip . && cd ..
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly android-for-windows-nightly.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly build (${GITHUB_SHA::7})" \
            --notes "Unzip and double-click run-test.bat"
