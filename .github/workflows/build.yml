name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Build a real Android library with Google's Android NDK
  android-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libhello.so (Android x86_64, API 24)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "Using NDK: $NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p out
          "$TC/clang" --target=x86_64-linux-android24 -shared -fPIC -O2 \
            -fstack-protector-strong -U_FORTIFY_SOURCE \
            -Wl,--pack-dyn-relocs=none -Wl,-soname,libhello.so \
            -o out/libhello.so test/hello.c -llog
          "$TC/clang" --target=x86_64-linux-android24 -shared -fPIC -O2 \
            -Wl,--pack-dyn-relocs=none -o out/libsyscall_test.so test/syscall_test.c
          "$TC/clang" --target=x86_64-linux-android24 -shared -fPIC -O2 \
            -Wl,--pack-dyn-relocs=none -o out/libredzone_test.so test/redzone_test.c
          "$TC/clang" --target=x86_64-linux-android29 -shared -fPIC -O2 \
            -Wl,--pack-dyn-relocs=none -o out/libtls_test.so test/tls_test.c
          "$TC/clang" --target=x86_64-linux-android29 -shared -fPIC -O2 \
            -Wl,--pack-dyn-relocs=none -o out/libfs_gate_test.so test/fs_gate_test.c
          "$TC/clang" --target=x86_64-linux-android29 -shared -fPIC -O2 -nostdlib \
            -Wl,--pack-dyn-relocs=none -o out/libgs_gate_test.so test/gs_gate_test.c
          "$TC/clang" --target=x86_64-linux-android29 -shared -fPIC -O2 \
            -Wl,--pack-dyn-relocs=none -o out/libtls_ie_test.so test/tls_ie_test.c
          "$TC/clang" --target=x86_64-linux-android29 -shared -fPIC -O2 -fstack-protector-all \
            -Wl,--pack-dyn-relocs=none -o out/libifunc_test.so test/ifunc_test.c
          "$TC/clang" --target=x86_64-linux-android34 -shared -fPIC -O2 -Wl,--pack-dyn-relocs=none \
            -o out/libreal_libc_test.so test/real_libc_test.c
          # executables: one with no libc (checks the initial stack), one ordinary (real bionic)
          "$TC/clang" --target=x86_64-linux-android29 -O2 -fno-jump-tables -nostdlib -fPIE -pie \
            -Wl,--pack-dyn-relocs=none -o out/exec_min test/exec_min.c
          # negative ELF test (PR #16, reviewer 2): e_entry inside a non-executable PT_LOAD segment
          python3 -c '
          import struct
          data = bytearray(open("out/exec_min", "rb").read())
          phoff = struct.unpack_from("<Q", data, 32)[0]
          phent, phnum = struct.unpack_from("<HH", data, 54)
          bad = None
          for i in range(phnum):
              ptype, pflags, _, pvaddr, _, _, pmemsz, _ = struct.unpack_from("<IIQQQQQQ", data, phoff + i * phent)
              if ptype == 1 and (pflags & 1) == 0 and pvaddr > 0 and pmemsz > 0:
                  bad = pvaddr
                  break
          assert bad is not None, "no non-executable PT_LOAD with vaddr > 0 found"
          struct.pack_into("<Q", data, 24, bad)
          open("out/exec_bad_entry", "wb").write(data)
          print(f"created out/exec_bad_entry with non-exec e_entry=0x{bad:x}")
          '
          "$TC/clang" --target=x86_64-linux-android34 -O2 -fPIE -pie -Wl,--pack-dyn-relocs=none \
            -o out/hello_exe test/hello_exe.c
          "$TC/clang" --target=x86_64-linux-android29 -shared -fPIC -O2 -nostdlib -Wl,-soname,libdeps_base.so \
            -o out/libdeps_base.so test/deps_base.c
          "$TC/clang" --target=x86_64-linux-android29 -shared -fPIC -O2 -nostdlib -Lout -ldeps_base \
            -o out/libdeps_user.so test/deps_user.c
          echo "deps libraries (default NDK relocation packing on purpose):"
          "$TC/llvm-readelf" -dW out/libdeps_base.so out/libdeps_user.so | grep -iE "relr|rela|init_array|needed" || true
          "$TC/clang" --target=x86_64-linux-android29 -shared -fPIC -O2 \
            -Wl,--pack-dyn-relocs=none -o out/libflow_test.so test/flow_test.c
          echo "--- fs:[reg] forms in libtls_ie_test.so"
          "$TC/llvm-objdump" -d out/libtls_ie_test.so | grep -E "%fs" 
          echo "--- G1-TLS: how the NDK compiles thread-local storage (measured, not assumed)"
          "$TC/llvm-readelf" -lW out/libtls_test.so | grep -E "TLS|Type"
          "$TC/llvm-readelf" -rW out/libtls_test.so | grep -E "TPOFF|DTP|TLS" || echo "  no TLS relocations"
          "$TC/llvm-objdump" -d out/libtls_test.so | grep -E "fs:|tls_get_addr" || true
          if "$TC/llvm-readelf" -rW out/libtls_test.so | grep -q TLSDESC; then echo "TLSDESC emitted: not supported yet"; exit 1; fi
          "$TC/clang++" --target=x86_64-linux-android24 -shared -fPIC -O2 -fstack-protector-strong \
            -Wl,--pack-dyn-relocs=none -o out/libcxx_exception_test.so test/cxx_exception_test.cpp
          echo "--- landing pads in libcxx_exception_test.so (from .gcc_except_table)"
          "$TC/llvm-readelf" -SW out/libcxx_exception_test.so | grep -E "gcc_except|eh_frame"
          "$TC/llvm-readelf" -h -d out/libhello.so
          echo "--- TLS relocations (GOTTPOFF/TPOFF would mean real initial-exec ELF TLS) ---"
          for f in out/libhello.so out/libsyscall_test.so; do echo "$f:"; "$TC/llvm-readelf" -rW "$f" | grep -E "TPOFF|TLS|DTPMOD" || echo "  none"; done
          echo "--- section containing offset 0x4f5 in libhello.so ---"
          "$TC/llvm-readelf" -SW out/libhello.so | grep -E "^\s+\[" | head -30
          echo "--- afw_stack_test machine code ---"
          "$TC/llvm-objdump" -d --disassemble-symbols=afw_stack_test out/libhello.so
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" out/
      - uses: actions/upload-artifact@v4
        with:
          name: libhello
          path: |
            out/*.so
            out/exec_min
            out/exec_bad_entry
            out/hello_exe

  # Gate G1 experiment: static scan of the real bionic libc.so.
  # The extracted Android files are NOT uploaded (licensing): only the report.
  bionic-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Extract real bionic libc.so from an Android 14 x86_64 image
        run: bash tools/fetch_bionic.sh
      - name: Build the scanner (Zydis)
        run: bash tools/build_scan.sh
      - name: Scan libc.so
        run: |
          DBG=""; [ -f out/bionic/libc.debug ] && DBG=out/bionic/libc.debug
          out/scan/syscall_scan out/bionic/libc.so $DBG | tee out/libc-scan.txt
          if [ -f out/bionic/linker64 ]; then
            out/scan/syscall_scan out/bionic/linker64 | tee out/linker64-scan.txt
          fi
      - name: "Analyse: ELF TLS in the real libc.so"
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"; TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "--- PT_TLS"; "$TC/llvm-readelf" -lW out/bionic/libc.so | grep -E "TLS|Type"
          echo "--- TLS relocations by type"; "$TC/llvm-readelf" -rW out/bionic/libc.so | grep -oE "R_X86_64_(TPOFF64|TPOFF32|DTPMOD64|DTPOFF64|GOTTPOFF|TLSGD|TLSLD|TLSDESC)" | sort | uniq -c
          echo "--- TPOFF64 relocations (offset, symbol)"; "$TC/llvm-readelf" -rW out/bionic/libc.so | grep TPOFF | head -20
          echo "--- TLS symbols"; "$TC/llvm-readelf" -sW out/bionic/libc.so | grep " TLS " | head -20
          echo "--- one fs:[reg] site (gwp_asan initPRNG)"
          "$TC/llvm-objdump" -d --no-show-raw-insn --disassemble-symbols=_ZN8gwp_asan20GuardedPoolAllocator8initPRNGEv out/bionic/libc.so | head -25
      - name: "Measure: which libc_shared_globals fields libc.so uses (G1 libc init)"
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"; TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          slots=$("$TC/llvm-readelf" -rW out/bionic/libc.so | awk '/__loader_shared_globals/{print $1}')
          echo "GOT/PLT slots of __loader_shared_globals: $slots"
          "$TC/llvm-objdump" -d --no-show-raw-insn out/bionic/libc.so | python3 -I tools/sg_uses.py $slots | tee out/shared-globals-scan.txt
          echo "--- every instruction that mentions a slot (calls and loads)"
          for s in $slots; do "$TC/llvm-objdump" -d --no-show-raw-insn out/bionic/libc.so | grep -c "# 0x$(echo $s | sed 's/^0*//')" || true; done
          echo "--- other __loader_* imports of libc.so and libdl.so"
          "$TC/llvm-readelf" --dyn-syms -W out/bionic/libc.so | grep -E "UND .*__loader_|File:" || true
          echo "--- G1 TCB: how libc reaches its per-thread state (thread pointer slots, errno, pthread_internal_t)"
          "$TC/llvm-objdump" -d --no-show-raw-insn --disassemble-symbols=__errno,pthread_self,gettid,__get_thread,__set_errno_internal,_Z25__libc_init_main_thread_earlyRK19KernelArgumentBlockP10bionic_tcb,_Z24__libc_init_main_thread_latev,_Z23__libc_init_main_threadP10bionic_tcb out/bionic/libc.so | head -120 || true
          echo "--- the first Windows crash site (libc.so+0xb7cd8: errno written through an empty slot)"
          "$TC/llvm-objdump" -d --no-show-raw-insn --start-address=0xb7cb0 --stop-address=0xb7ce8 out/bionic/libc.so | tail -n +6
          echo "--- G1: libc.so+0x48350..0x48400 (netdClientInit; the call through NULL at 0x483cf on Windows)"
          "$TC/llvm-objdump" -d --no-show-raw-insn --start-address=0x48350 --stop-address=0x48400 out/bionic/libc.so | tail -n +6
          echo "--- libdl.so: what it imports (ld-android is not loaded: weak ones become NULL)"
          [ -f out/bionic/libdl.so ] || python3 -I tools/fetch_bionic.py out/bionic-py >/dev/null
          DL=out/bionic/libdl.so; [ -f "$DL" ] || DL=out/bionic-py/libdl.so
          "$TC/llvm-readelf" --dyn-syms -W "$DL" | grep " UND " || true
          "$TC/llvm-objdump" -d --no-show-raw-insn --disassemble-symbols=dlopen,dlsym "$DL" | tail -n +6 | head -30
          echo "--- every distinct fs: displacement in libc.so (which TCB slots are used, how often)"
          "$TC/llvm-objdump" -d --no-show-raw-insn out/bionic/libc.so | grep -oE "%fs:0x[0-9a-f]+" | sort | uniq -c
          echo "--- libc.so constructors (.init_array) and the symbols at their addresses"
          "$TC/llvm-readelf" -x .init_array out/bionic/libc.so | tail -n +3 || true
      - name: "Measure: patch the real libraries (never run them)"
        run: |
          bash tools/build_linux.sh
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cp "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" out/
          for f in out/bionic/libc.so out/bionic/linker64 out/libc++_shared.so; do
            echo "================ $f"
            out/afw-loader "$f" --patch-report 2>&1 | grep -vE "^  MISSING" | tee -a out/patch-scan.txt
          done
          echo "--- expected load-gate results (an unexpected change fails the build)"
          # libc: RUN - every one of its 17 fs:[reg] sites (gwp_asan ELF TLS) gets a trampoline
          test "$(grep -c "fs:\[reg\] at libc.so+0x[0-9a-f]*: ELF TLS access, trampoline" out/patch-scan.txt)" -eq 17
          grep -E "fs:\[reg\] at libc" out/patch-scan.txt || true
          grep -q "GATE libc.so: would RUN" out/patch-scan.txt
          grep -q "GATE ld-android.so: would REFUSE" out/patch-scan.txt   # 3 unproven look-alikes, known
          echo "gate results as expected"
          echo "--- libc ELF TLS: who uses the TPOFF64 GOT entry (issue #3, proposal 1; issue #4)" | tee out/libc-tls-scan.txt
          {
            readelf -lW out/bionic/libc.so | grep -E "Type|TLS"
            readelf -rW out/bionic/libc.so | grep -E "TPOFF|DTPMOD|DTPOFF" || echo "no TLS relocations"
            objdump -d --no-show-raw-insn out/bionic/libc.so > out/libc.dis
            for got in $(readelf -rW out/bionic/libc.so | awk '/TPOFF64/{print $1}' | sed 's/^0*//'); do
              echo "== instructions that load GOT entry 0x$got (the TPOFF64 value):"
              grep -n "# $got <\|# $got\b" out/libc.dis | sed 's/^[0-9]*://' || true
            done
            echo "== every fs: access other than fs:0x28, with 10 instructions before and 3 after:"
            grep -nE "%fs:" out/libc.dis | grep -v "%fs:0x28" | cut -d: -f1 | while read n; do
              echo "----"; sed -n "$((n>10?n-10:1)),$((n+3))p" out/libc.dis
            done
          } | tee -a out/libc-tls-scan.txt
          echo "--- full record of every UNPROVEN site (for docs/unproven/)"
          grep "^UNPROVEN-DETAIL" out/patch-scan.txt | sed 's/^UNPROVEN-DETAIL //' > out/unproven-scan.txt
          cat out/unproven-scan.txt
          n=$(grep -c "^====" out/unproven-scan.txt || true)
          echo "UNPROVEN sites recorded: $n (expected 9: 3 in linker64, 6 in libc++)"
          test "$n" -eq 9
      - name: "Measure: %gs: in ART - libart.so and the boot image (G3 planning, issue #15)"
        continue-on-error: true
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"; TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 -I tools/fetch_bionic.py out/artprobe --art | grep -E "^== (found|libart|apex-|system-)" || true
          : > out/art-gs-scan.txt
          # libart.so: objdump (function names); .oat: gs_count (Zydis, symbols ignored -
          # objdump prints .oat code as data: its one symbol, oatexec, is an OBJECT)
          "$TC/llvm-objdump" -d --no-show-raw-insn out/artprobe/art/libart.so | python3 -I tools/gs_scan.py libart.so | tee -a out/art-gs-scan.txt
          out/scan/gs_count out/artprobe/art/libart.so "libart.so (Zydis, cross-check)" | tee -a out/art-gs-scan.txt
          for f in out/artprobe/art/*.oat; do
            out/scan/gs_count "$f" "$(basename "$f") (APPROXIMATE: linear sweep, method headers in between)" | tee -a out/art-gs-scan.txt
          done
          echo "--- our gate on libart.so as it is today" | tee -a out/art-gs-scan.txt
          out/afw-loader out/artprobe/art/libart.so --patch-report 2>&1 \
            | grep -E "^(Library|Needs|Code|Patched|GATE|TLS)|unproven|UNPROVEN [0-9]|refused" | head -30 | tee -a out/art-gs-scan.txt
          rm -rf out/artprobe                  # extracted files are never uploaded (rule 5)
      - uses: actions/upload-artifact@v4
        with:
          name: bionic-scan-report
          path: out/*-scan.txt

  # Every test again on Linux under AddressSanitizer + UBSan (mandatory)
  linux-asan:
    needs: android-lib
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: libhello
          path: out
      - name: Build loader and VMA tests with ASan + UBSan
        run: |
          OUTBIN=out/afw-asan EXTRA_CFLAGS="-g -fsanitize=address,undefined,pointer-compare -fno-sanitize-recover=undefined" bash tools/build_linux.sh
          OUTBIN=out/afw-asan-test EXTRA_CFLAGS="-g -DAFW_TEST -fsanitize=address,undefined,pointer-compare -fno-sanitize-recover=undefined" bash tools/build_linux.sh
          cc -g -O1 -DAFW_TEST -fsanitize=address,undefined -fno-sanitize-recover=undefined -Wall \
             -o out/vma_test tools/vma_test.c src/vma.c src/syscall.c src/platform.c
          cc -g -O1 -fsanitize=address,undefined -fno-sanitize-recover=undefined -Wall -Wextra \
             -o out/tls_layout_test tools/tls_layout_test.c src/tls_layout.c
      - name: Run all tests under ASan
        run: |
          set -euo pipefail
          export ASAN_OPTIONS=detect_invalid_pointer_pairs=2
          nm out/afw-asan > out/afw-asan.syms
          if grep -Eq " (afw_vma_test_fail_os|afw_load_test_fail_adopt)$" out/afw-asan.syms; then
            echo "fault injection present in non-test loader"; exit 1
          fi
          out/vma_test
          out/tls_layout_test
          out/afw-asan out/libhello.so
          out/afw-asan out/libsyscall_test.so
          out/afw-asan out/libredzone_test.so
          out/afw-asan out/libtls_test.so
          out/afw-asan out/libifunc_test.so
          out/afw-asan out/libdeps_user.so --with-deps --finish-fail=out/libdeps_user.so | tee out/finish-fail.txt
          grep -q "lib_finish failure cleaned up cleanly" out/finish-fail.txt
          # late lib_finish() failures (after TLS close / IFUNC): quarantine cleanly, no UAF/orphan TLS/leak
          out/afw-asan-test out/libhello.so --finish-fail-late=tls:out/libtls_test.so | tee out/finish-fail-late-tls.txt
          grep -q "late TLS lib_finish failure quarantined cleanly" out/finish-fail-late-tls.txt
          out/afw-asan-test out/libhello.so --finish-fail-late=ifunc:out/libifunc_test.so | tee out/finish-fail-late-ifunc.txt
          grep -q "late IFUNC lib_finish failure quarantined cleanly" out/finish-fail-late-ifunc.txt
          out/afw-asan-test out/libhello.so --finish-fail-late=dep:out/libdeps_user.so | tee out/finish-fail-late-dep.txt
          grep -q "late dep-set lib_finish failure kept base loaded and quarantined user" out/finish-fail-late-dep.txt
          out/afw-asan-test out/libhello.so --finish-fail-late=stress:out/libifunc_test.so | tee out/finish-fail-late-stress.txt
          grep -q "stress test: 70 late lib_finish failures quarantined cleanly" out/finish-fail-late-stress.txt
          # a refused library (PT_TLS + fs:[reg], refused on Linux) leaves nothing behind
          out/afw-asan out/libtls_test.so --preload-fail=out/libtls_ie_test.so | tee out/preload.txt
          grep -q "refused, and nothing left behind" out/preload.txt
          # a 32-bit compare / 8-bit copy does not bound a 64-bit index: both tables UNPROVEN, refused
          out/afw-asan out/libflow_test.so --patch-report > out/flow.txt 2>&1 || true
          grep -E "UNPROVEN:|^GATE" out/flow.txt
          test "$(grep -c "\[audit\] UNPROVEN: syscall" out/flow.txt)" -eq 2
          grep -q "would REFUSE" out/flow.txt
          if out/afw-asan out/libfs_gate_test.so > out/fsgate.txt 2>&1; then cat out/fsgate.txt; echo "fs: gate did not refuse"; exit 1; fi
          grep -q "6 unsupported fs: accesses" out/fsgate.txt
          # gs: is the TEB on Windows and nothing rewrites it yet (issue #15)
          if out/afw-asan out/libgs_gate_test.so > out/gsgate.txt 2>&1; then cat out/gsgate.txt; echo "gs: gate did not refuse"; exit 1; fi
          grep -q "3 unsupported gs: accesses" out/gsgate.txt
          # an executable: the initial stack (argc, argv, envp, auxv) as the kernel builds it
          set +e; AFW_EXEC_MIN=ok AFW_OVERRIDE=one out/afw-asan out/exec_min --env AFW_OVERRIDE=two --exec hello world > out/exec.txt 2>&1; rc=$?; set -e
          [ $rc -eq 42 ] || { cat out/exec.txt; echo "exec_min exited $rc, not 42"; exit 1; }
          set +e; AFW_EXEC_MIN=ok AFW_OVERRIDE=one out/afw-asan out/exec_min --clean-env --exec hello world > /dev/null 2>&1; rc=$?; set -e
          [ $rc -eq 17 ] || { echo "exec_min with --clean-env exited $rc, not 17"; exit 1; }
          set +e; AFW_EXEC_MIN=ok AFW_OVERRIDE=one out/afw-asan out/exec_min --exec hello world > /dev/null 2>&1; rc=$?; set -e
          [ $rc -eq 18 ] || { echo "exec_min without override exited $rc, not 18"; exit 1; }
          set +e; AFW_EXEC_MIN=ok out/afw-asan out/exec_min --env AFW_OVERRIDE=two --exec hello > /dev/null 2>&1; rc=$?; set -e
          [ $rc -eq 11 ] || { echo "exec_min with a wrong argc exited $rc, not 11"; exit 1; }
          if out/afw-asan out/exec_bad_entry --exec hello world > out/badentry.txt 2>&1; then
            cat out/badentry.txt; echo "exec_bad_entry was not refused"; exit 1
          fi
          grep -q "outside any executable PT_LOAD segment" out/badentry.txt
          # fs:[reg] is rewritten on Windows only: on Linux the gate must refuse it
          if out/afw-asan out/libtls_ie_test.so > out/ie.txt 2>&1; then cat out/ie.txt; echo "fs:[reg] ran unrewritten"; exit 1; fi
          grep -q "8 fs:\[reg\] accesses not rewritten" out/ie.txt
          out/afw-asan out/libcxx_exception_test.so --patch-report --strict --min-landing-pads=1
          out/afw-asan out/libc++_shared.so --patch-report

  # 2. Build the loader on Windows and run the Android library with it
  windows:
    needs: android-lib
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: libhello
          path: out
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build afw-loader.exe
        shell: cmd
        run: build.bat
      - name: Run M0 tests on Windows
        shell: cmd
        run: out\afw-loader.exe out\libhello.so
      - name: Run G1 syscall-patching tests on Windows
        shell: cmd
        run: out\afw-loader.exe out\libsyscall_test.so
      - name: "A crash is reported, never hidden as a hang (execute fault at a low address)"
        timeout-minutes: 1
        shell: cmd
        run: |
          out\afw-loader.exe out\libsyscall_test.so --call-bad-ip --watchdog=20 > out\badip.txt 2>&1
          type out\badip.txt
          findstr /c:"=== CRASH ===" out\badip.txt >nul || (echo no crash report & exit /b 1)
          findstr /c:"executing address 0x28" out\badip.txt >nul || (echo wrong report & exit /b 1)
          findstr /c:"WATCHDOG" out\badip.txt >nul && (echo it hung & exit /b 1)
          exit /b 0
      - name: "Dependencies: a library's import resolves to its loaded DT_NEEDED library"
        shell: cmd
        run: out\afw-loader.exe out\libdeps_user.so --with-deps --finish-fail=out\libdeps_user.so
      - name: "Late lib_finish failures (after TLS close / IFUNC): quarantine cleanly"
        shell: cmd
        run: |
          if not exist out\testobj mkdir out\testobj
          clang-cl /nologo /O2 /W3 /DAFW_TEST /D_CRT_SECURE_NO_WARNINGS -Wno-unused-function -Iout\zydis-amalg ^
              /Fe:out\afw-loader-test.exe /Foout\testobj\ ^
              src\main.c src\elf_loader.c src\bionic_shim.c src\platform.c src\tls_patch.c src\crash.c ^
              src\patch.c src\syscall.c src\funcs.c src\vma.c src\tls_layout.c src\tls_static.c src\loader_api.c src\exec.c out\Zydis.obj ^
              /link dbghelp.lib
          if errorlevel 1 exit /b 1
          out\afw-loader-test.exe out\libhello.so --finish-fail-late=tls:out\libtls_test.so
          if errorlevel 1 exit /b 1
          out\afw-loader-test.exe out\libhello.so --finish-fail-late=ifunc:out\libifunc_test.so
          if errorlevel 1 exit /b 1
          out\afw-loader-test.exe out\libhello.so --finish-fail-late=dep:out\libdeps_user.so
          if errorlevel 1 exit /b 1
          out\afw-loader-test.exe out\libhello.so --finish-fail-late=stress:out\libifunc_test.so
          if errorlevel 1 exit /b 1
      - name: "G1: extract the real bionic on this Windows runner (never uploaded)"
        shell: bash
        run: python -I tools/fetch_bionic.py out/bionic
      - name: "An executable's initial stack (argc, argv, envp, auxv) on Windows"
        shell: cmd
        run: |
          set AFW_EXEC_MIN=ok
          set AFW_OVERRIDE=one
          out\afw-loader.exe out\exec_min --env AFW_OVERRIDE=two --exec hello world > out\exec.txt 2>&1
          if not %errorlevel% equ 42 (type out\exec.txt & echo exec_min exited %errorlevel%, not 42 & exit /b 1)
          out\afw-loader.exe out\exec_min --clean-env --exec hello world > nul 2>&1
          if not %errorlevel% equ 17 (echo clean-env exited %errorlevel%, not 17 & exit /b 1)
          out\afw-loader.exe out\exec_min --exec hello world > nul 2>&1
          if not %errorlevel% equ 18 (echo missing override exited %errorlevel%, not 18 & exit /b 1)
          out\afw-loader.exe out\exec_min --env AFW_OVERRIDE=two --exec hello > nul 2>&1
          if not %errorlevel% equ 11 (echo wrong argc exited %errorlevel%, not 11 & exit /b 1)
          out\afw-loader.exe out\exec_bad_entry --exec hello world > out\badentry.txt 2>&1
          if %errorlevel% equ 0 (type out\badentry.txt & echo exec_bad_entry was not refused & exit /b 1)
          findstr /c:"outside any executable PT_LOAD segment" out\badentry.txt >nul || (type out\badentry.txt & echo wrong error for exec_bad_entry & exit /b 1)
          exit /b 0
      - name: "G1: an ordinary Android executable runs main() with the real libc (required)"
        timeout-minutes: 3
        shell: cmd
        run: |
          set AFW_LIB_PATH=out\bionic
          set AFW_HOST_VAR=from_windows
          out\afw-loader.exe out\hello_exe --with-deps --watchdog=60 --env AFW_FLAG_VAR=from_flag --exec world > out\hello-exe.txt 2>&1
          set rc=%errorlevel%
          type out\hello-exe.txt
          if not "%rc%"=="42" (echo hello_exe exited %rc%, not 42 & exit /b 1)
          findstr /c:"constructor=1" out\hello-exe.txt >nul || (echo main did not run after the constructor & exit /b 1)
          findstr /c:"ctor_auxv=1" out\hello-exe.txt >nul || (echo full auxv was not ready in constructor & exit /b 1)
          findstr /c:"host_env=from_windows" out\hello-exe.txt >nul || (echo host env var was not forwarded & exit /b 1)
          findstr /c:"flag_env=from_flag" out\hello-exe.txt >nul || (echo --env flag var was not forwarded & exit /b 1)
          findstr /c:"atexit handler ran" out\hello-exe.txt >nul || (echo atexit did not run & exit /b 1)
          exit /b 0
      - name: "G1: Android code calling the REAL libc.so on Windows (required)"
        timeout-minutes: 3
        shell: cmd
        run: |
          set AFW_LIB_PATH=out\bionic
          out\afw-loader.exe out\libreal_libc_test.so --with-deps --watchdog=60 > out\real-libc.txt 2>&1
          set rc=%errorlevel%
          type out\real-libc.txt
          if not "%rc%"=="0" (echo the loader exited with %rc% & exit /b 1)
          findstr /c:"REAL LIBC TEST PASSED" out\real-libc.txt >nul || (echo real libc test did not pass & exit /b 1)
      - name: "G1 probe: load the real libc.so for real (constructors run) - informational"
        continue-on-error: true
        timeout-minutes: 3       # a hang is a result too: the output so far is printed live
        shell: cmd
        run: |
          out\afw-loader.exe out\bionic\libc.so --with-deps --watchdog=60 2>&1
          echo exit code %errorlevel%
      - name: "VMA layer: mmap / munmap / mprotect / madvise on Windows"
        shell: cmd
        run: |
          clang-cl /nologo /O2 /W3 /DAFW_TEST /D_CRT_SECURE_NO_WARNINGS /Fe:out\vma_test.exe /Foout\ tools\vma_test.c src\vma.c src\syscall.c src\platform.c
          out\vma_test.exe
      - name: "C++ exceptions: every landing pad found, nothing unproven (static)"
        shell: cmd
        run: out\afw-loader.exe out\libcxx_exception_test.so --patch-report --strict --min-landing-pads=1
      - name: "A refused site must trap loudly (ud2), not reach the Windows kernel"
        shell: cmd
        run: |
          out\afw-loader.exe out\libsyscall_test.so --call-trap > out\trap.txt 2>&1
          if %errorlevel% equ 0 (type out\trap.txt & echo did not crash & exit /b 1)
          if %errorlevel% equ 99 (type out\trap.txt & echo did not trap & exit /b 1)
          type out\trap.txt | findstr /c:"exception 0xc000001d" /c:"REFUSED to patch"
          findstr /c:"the loader REFUSED to patch" out\trap.txt
      - name: "G1-TLS: ELF thread-local storage, two threads, both access models"
        shell: cmd
        run: out\afw-loader.exe out\libtls_test.so
      - name: "IFUNC resolvers run only after patching (they read the stack guard)"
        shell: cmd
        run: out\afw-loader.exe out\libifunc_test.so
      - name: "G1-TLS: fs:[reg] accesses through trampolines (gwp_asan form)"
        shell: cmd
        run: out\afw-loader.exe out\libtls_ie_test.so
      - name: "Negative test: unsupported fs: accesses must be refused"
        shell: cmd
        run: |
          out\afw-loader.exe out\libfs_gate_test.so > out\fsgate.txt 2>&1
          if %errorlevel% equ 0 (type out\fsgate.txt & echo fs: gate did not refuse & exit /b 1)
          findstr /c:"6 unsupported fs: accesses" out\fsgate.txt
      - name: "Negative test: gs: accesses must be refused (gs is the TEB on Windows)"
        shell: cmd
        run: |
          out\afw-loader.exe out\libgs_gate_test.so > out\gsgate.txt 2>&1
          if %errorlevel% equ 0 (type out\gsgate.txt & echo gs: gate did not refuse & exit /b 1)
          findstr /c:"3 unsupported gs: accesses" out\gsgate.txt
      - name: "Negative test: red zone sites must be refused"
        shell: cmd
        run: out\afw-loader.exe out\libredzone_test.so
      - name: "Explore: load the NDK's real libc++_shared.so"
        continue-on-error: true
        shell: cmd
        run: out\afw-loader.exe out\libc++_shared.so --patch-report
      - name: "Experiment: fs: TLS on Windows"
        shell: cmd
        run: |
          clang-cl /nologo /O2 /Fe:out\fs_probe.exe /Foout\ tools\fs_probe.c
          out\fs_probe.exe
      - name: "Experiment: WRFSBASE on Windows"
        shell: cmd
        run: |
          clang-cl /nologo /O2 /Fe:out\fsbase_probe.exe /Foout\ tools\fsbase_probe.c
          out\fsbase_probe.exe
      - name: Package
        shell: cmd
        run: |
          mkdir pkg
          copy out\afw-loader.exe pkg\
          copy out\libhello.so pkg\
          copy tools\run-test.bat pkg\
          copy out\fsbase_probe.exe pkg\
          copy tools\run-fsbase-probe.bat pkg\
      - uses: actions/upload-artifact@v4
        with:
          name: afw-windows
          path: pkg/*

  # 3. Publish a download link: Releases -> nightly
  release:
    needs: windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: afw-windows
          path: pkg
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pkg && zip -r ../android-for-windows-nightly.zip . && cd ..
          gh release delete nightly --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create nightly android-for-windows-nightly.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly build (${GITHUB_SHA::7})" \
            --notes "Unzip and double-click run-test.bat"
